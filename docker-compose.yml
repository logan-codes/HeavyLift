services:
  postgres:
    image: postgres:16
    container_name: cat-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cat_rental
      POSTGRES_USER: cat_rental
      POSTGRES_PASSWORD: cat_rental_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat_rental -d cat_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
