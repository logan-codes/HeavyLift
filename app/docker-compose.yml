services:
  # ── Infrastructure ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: cat-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cat_rental
      POSTGRES_USER: cat_rental
      POSTGRES_PASSWORD: cat_rental_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat_rental -d cat_rental"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Spring Boot + Flyway) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cat-rental-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cat_rental
      SPRING_DATASOURCE_USERNAME: cat_rental
      SPRING_DATASOURCE_PASSWORD: cat_rental_dev
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_SECRET: dev-only-ai-secret
      DEVICE_API_KEY: dev-only-device-key
      JWT_SECRET: dev-only-secret-change-me-please-1234567890
      APP_CORS_ALLOWED_ORIGINS: http://localhost:80,http://frontend:80
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── AI / ML Service (FastAPI) ──────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cat-rental-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cat_rental
      DB_USER: cat_rental
      DB_PASSWORD: cat_rental_dev
      AI_SERVICE_SECRET: dev-only-ai-secret
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  # ── Frontend (React/Vite → nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cat-rental-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # ── Data Generator (seed + live stream) ───────────────────────────────────────
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: cat-rental-data-gen
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cat_rental
      DB_USER: cat_rental
      DB_PASSWORD: cat_rental_dev
      API_BASE_URL: http://backend:8080
      DEVICE_API_KEY: dev-only-device-key

volumes:
  pgdata:
